name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node (for future API smoke test)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build solution (Release, x64)
        shell: pwsh
        run: |
          # windows-latest 自带 VS 完整工具链(含 MSIX/WinUI),msbuild 才能编译 WinUI 3 主程序
          msbuild MicaSound.sln -restore -t:Build -p:Configuration=Release -p:Platform=x64 -v:m -nologo

      - name: Run CLI smoke test
        shell: pwsh
        env:
          CI: "true"
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/ensure-api.ps1
          dotnet run --project src/MicaSound.Cli/MicaSound.Cli.csproj -c Release --no-build